<body style="font-family: Arial, sans-serif;">

<h2>🧪 Go Unit Test Report</h2>

<table border="1" cellpadding="8" cellspacing="0">
    <tr>
        <td><b>Status</b></td>
        <td>{{ STATUS }}</td>

    <tr>
        <td><b>Repository</b></td>
        <td>{{ REPO_NAME }}</td>

    <tr>

    <tr>
