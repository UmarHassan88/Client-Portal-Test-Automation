name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: "30 04 * * *"


jobs:
  test:
    runs-on: ubuntu-latest
    environment: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      # - name: Install Allure CLI
      #   run: |
      #     npm install -D allure-commandline
      #     npm list allure-playwright || true

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        continue-on-error: true
        run: npx playwright test
   
      - name: Generate Allure HTML Report
        if: always()
        run: |
          npm run allure:report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 7

      - name: Prepare Email Template
        if: always()
        shell: bash
        run: |
          sed \
          -e "s|{{STATUS}}|${{ job.status }}|g" \
          -e "s|{{RUN_NUMBER}}|${{ github.run_number }}|g" \
          -e "s|{{REPOSITORY}}|${{ github.repository }}|g" \
          -e "s|{{BRANCH}}|${{ github.ref_name }}|g" \
          -e "s|{{ACTOR}}|${{ github.actor }}|g" \
          -e "s|{{WORKFLOW}}|${{ github.workflow }}|g" \
          -e "s|{{RUN_URL}}|https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|g" \
          .github/email-templates/playwright-report.html > email.html   
        
      - name: Send Mail
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: "🎭 Playwright Test Report - Run #${{ github.run_number }} (${{ job.status }})"
          to: qa@aqaryint.com
          cc: saif@aqaryint.com,laxmikant@aqaryint.com
          from: CI Notification <noreply@aqaryservices.com>
          html_body: file://email.html
          attachments: playwright-report/index.html  