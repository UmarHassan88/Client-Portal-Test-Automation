name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  repository_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      continue-on-error: true
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Install Allure CLI
      if: always()
      run: |
        npm install -D allure-commandline
        npx allure --version
        
    - name: Generate Allure HTML Report
      if: always()
      run: |
        npx allure generate allure-results --clean --single-file -o allure-report

    - name: Prepare Email Report
      run: |
        REPOSITORY=$(echo "${{ github.repository }}" | sed 's/[\/&]/\\&/g')
        BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[\/&]/\\&/g')
        ACTOR=$(echo "${{ github.actor }}" | sed 's/[\/&]/\\&/g')
        WORKFLOW=$(echo "${{ github.workflow }}" | sed 's/[\/&]/\\&/g')
        STATUS=$(echo "${{ job.status }}" | sed 's/[\/&]/\\&/g')
        SHA=$(echo "${{ github.sha }}" | sed 's/[\/&]/\\&/g')
        sed \
        -e "s|{{ repository }}|${REPOSITORY}|g" \
        -e "s|{{ branch }}|${BRANCH}|g" \
        -e "s|{{ actor }}|${ACTOR}|g" \
        -e "s|{{ workflow }}|${WORKFLOW}|g" \
        -e "s|{{ status }}|${STATUS}|g" \
        -e "s|{{ commit }}|${SHA}|g" \
        -e "s|{{ timestamp }}|${TIMESTAMP}|g" \
        -e "s|{{ github_run_url }}|${RUN_URL}|g" \
        ci/email-templates.html > /tmp/final.html
    - name: Send Unit Smoke Test Report
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.sendgrid.net
        server_port: 587
        username: apikey
        password: ${{ secrets.SENDGRID_API_KEY }}

        subject: "🧪 Unit & Smoke Test Report | ${{ github.repository }} | ${{ job.status }}"

        to: qa@aqaryint.com
        cc: saif@aqaryint.com, laxmikant@aqaryint.com
        from: CI Notification <noreply@aqaryservices.com> 

        html_body: file:///tmp/final.html

        attachments: |
          allure-report/index.html     
        
        
