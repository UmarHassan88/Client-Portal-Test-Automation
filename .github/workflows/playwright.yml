name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  repository_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Allure CLI
        run: |
          npm install -D allure-commandline
          npm list allure-playwright || true

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        continue-on-error: true
        run: npx playwright test
   
      - name: Generate Allure HTML Report
        if: always()
        run: |
          npm run allure:report

      
      - name: Check Allure Report Size
        if: always()
        run: |
          echo "Allure report size:"
          du -sh allure-report || true
          echo "Allure index.html size:"
          ls -lh allure-report/index.html || true

          echo "Largest files in Allure report:"
          find allure-report -type f -printf '%s %p\n' 2>/dev/null \
           | sort -nr \
          | head -20
       


